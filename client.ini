; Sample of a correct ‘client.ini’ file :

; ConfigFile only treats ';' as a comment: a '#' line is parsed as a key and
; shows up as junk in the startup dump, so keep using ';' here.
; [observability]
; enabled=true
; collectorHost="http://localhost:4357"
; environnement="dev"
; level="trace"

[network]
websocket_url="ws://127.0.0.1:7040"

[chat]
broker_url="ws://127.0.0.1:9001"

; ---------------------------------------------------------------------------
; Diagnostics — only useful when we ask you for them.
;
; The game always writes a few lines at startup describing your machine
; (graphics card, driver, screens, your graphics settings). It writes NO
; performance measurements at all unless you turn them on below.
;
; If you report a performance problem (low FPS, stutter, freezes), set
; `debug_perf=true`, restart the game, play until the problem happens, quit,
; and send us the log file:
;   Windows : %APPDATA%\Godot\app_userdata\DyingStar\logs\godot.log
;   Linux   : ~/.local/share/godot/app_userdata/DyingStar/logs/godot.log
; The game prints where it read this file from at startup, so the log also
; tells us whether your edit was picked up at all.
;
; Keys are read from anywhere in this file, with or without a section.
; ---------------------------------------------------------------------------

[debug]

; Performance log. Every 2 s: framerate and frame-time distribution, memory
; (the game's AND your system's), engine and network counters, and a census of
; the game world; plus a marker line at every state change, so we can see what
; happens at the exact moment you spawn. Costs a few log lines per second.
debug_perf=false

; Fine tuning of the above; only worth touching if we ask you to.
; Seconds between reports:
; debug_perf_interval=2.0
; A frame longer than this (ms) is logged on its own line:
; debug_perf_hitch_ms=50.0
; Run the scene-tree census every Nth report:
; debug_perf_deep_every=2

; VERY heavy: logs the full content of every network packet received. It is
; slow enough to change what you are measuring, so never enable it together
; with a framerate measurement.
; debug_net_echo=false

; Mining-rock bisection switches. Most of them CHANGE WHAT YOU SEE (rocks
; hidden, all rocks with the same texture, less precise aiming) and exist only
; to narrow down a rock-field framerate report.
; log every rock cut:
; debug_rocks_verbose=false
; render uncut rocks without the CSG node:
; debug_rocks_no_csg=false
; skip the generated collider (aiming gets less precise):
; debug_rocks_scene_hull=false
; one material for every rock (they all look alike):
; debug_rocks_shared_mat=false
; hide the rock meshes (separates CPU cost from GPU cost):
; debug_rocks_hidden=false
