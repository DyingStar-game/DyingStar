; ---------------------------------------------------------------------------
; Diagnostics.
;
; `perf=true` arms the server performance rig: one [Perf] block every 2 s
; saying where the physics tick actually goes (engine/Jolt vs our scripts),
; how many props are awake, how many terrain collision chunks are loading,
; how many navigation maps the NPCs are baking, and how big the network
; flushes are. Turn it on when TPS drops, read the log, turn it back off —
; it costs two Time calls per replicated prop per tick.
;
; The same rig also answers to `--perf` on the command line and to DS_PERF=1
; in the environment; this key exists for a run straight from the Godot
; editor, where neither of those is reachable. The server prints which one
; armed it at boot.
; ---------------------------------------------------------------------------

[debug]
perf=false
; Per-script attribution of the physics step ([Perf/bands]); reorders
; _physics_process across scripts while on — diagnostics only.
perf_bands=false
; Server-side movement trace: one `[StepUp]` line per step-up decision of a
; player walking into something (what the probe saw, on which collider).
; The client's settings.ini `movement_debug` cannot reach the server.
movement=false

; ---------------------------------------------------------------------------
; NPC navigation (server). NPCs path on SHARED navmesh tiles (72 m lattice cells
; on block maps, kept by NpcNavCache, one per planet). Defaults in code; a key
; here to override it. Times are in seconds.
; ---------------------------------------------------------------------------

[npc]
; Age past which a tile is re-baked the next time an NPC asks for it (lazy:
; an idle tile is never re-baked). Lower it if parked props/vehicles must be
; picked up faster than the explicit invalidation already does.
;nav_box_ttl=120
; Age past which a tile's collected source geometry is re-collected before a
; re-bake instead of being reused.
;nav_parse_ttl=30
; Concurrent bakes (worker tasks); they share the worker pool with terrain
; chunk generation.
;nav_max_bakes=2
; A tile nobody has used for this long is freed.
;nav_box_evict=600
; Source geometry collector: `query` = physics broadphase query + worker
; face extraction (default, main thread cost ~0); `tree` = the engine's
; parse_source_geometry_data, main thread, whole planet — for A/B only.
;nav_parse_mode=query
