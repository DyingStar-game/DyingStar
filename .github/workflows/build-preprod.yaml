name: Build & Deploy to Preprod

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Disable Docker layer cache (force full rebuild)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  HARBOR_REGISTRY: harbor.dyingstar-game.space
  IMAGE_NAME: harbor.dyingstar-game.space/dyingstar/godotserver
  IMAGE_TAG: develop
  CHART_NAME: godotserver

jobs:
  build:
    name: Build Server Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download planet data
        run: bash tools/download_planet_data.sh

      - name: Delete blender files
        run: rm -fr assets_blender

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache == 'true' }}
          cache-from: ${{ (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch') && 'type=gha,scope=buildcache-preprod' || '' }}
          cache-to: ${{ (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch') && 'type=gha,mode=max,scope=buildcache-preprod' || '' }}

      - name: Trigger preprod deployment
        if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.KUBERNETES_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/kubernetes
          event-type: deploy-preprod
          client-payload: '{"chart": "${{ env.CHART_NAME }}"}'
