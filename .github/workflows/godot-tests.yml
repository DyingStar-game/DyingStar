name: "Godot gut test"
on:
  # A pull request's own pushes are tested by its pull_request event; testing every branch push as
  # well ran the whole suite twice per push.
  push:
    branches:
      - develop
      - main
    tags:
      - '*'
  # Runs test suite when a PR is opened or synchronyzed
  pull_request:
  # Runs test suite every night
  schedule:
    - cron:  '0 0 * * *'

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: godot-tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GODOT_VERSION: 4.7.2
  # The engine release (DyingStar-game/godotandaddons): Godot + our patches. Its name keys the caches.
  GODOT_RELEASE: 4.7.2-stable-ds1
  # The C# twins against their GDScript reference, bit for bit. Data-free: what needs tarsis_3's tile
  # cache goes pending, and test_the_whole_sphere_samples_identically_without_data covers every face.
  NATIVE_TESTS: res://test/unit/test_tile_frame_native.gd,res://test/unit/test_crack_voronoi_native.gd,res://test/unit/test_native_script.gd,res://test/unit/test_rock_impurity_native.gd,res://test/unit/test_chunk_native_normals.gd,res://test/unit/test_chunk_native_verts.gd

jobs:
  # On the project's own runners (ARC, like the client build). Every test blocks: the verdict comes
  # from tools/ci/run_gut.sh, which fails on a failing test AND on a test script that did not load.
  execute-gut:
    name: Run GUT tests
    runs-on: dyingstar-runners
    timeout-minutes: 60
    steps:
      - name: Install test tooling
        run: |
          # The self-hosted ARC runner image is minimal. python3 judges the run; fontconfig and a
          # monospace face are what SystemFont looks for (the repair screens' boot log); the others are
          # what the LiveKit extension links against: without them it does not load,
          # scenes/audio/livekit.gd does not compile, and every test script that preloads it is skipped.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget unzip python3 libfontconfig1 fonts-dejavu-core \
            libpipewire-0.3-0t64 libx11-6 libxext6 libxfixes3 libxinerama1 libsystemd0 libwayland-client0
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      # The whole tree, assets_blender included: game resources still point into it (the iron
      # mineral's roughness map), and without it the mineral catalogue does not compile.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        env:
          # The ARC runner runs as an unprivileged user and cannot write to /usr/share/dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '9.0.x'

      # Same key and path as build-client.yaml: one cached engine for both.
      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-mono-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q -O "$RUNNER_TEMP/godot.zip" \
            "https://github.com/DyingStar-game/godotandaddons/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          rm "$RUNNER_TEMP/godot.zip"
          chmod +x "$GODOT"

      # Every LiveKit dependency present, or a clear error here rather than 2 skipped test scripts.
      - name: LiveKit extension loads
        run: |
          missing=$(ldd addons/godot-livekit/bin/libgodot-livekit.linux.x86_64.so | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "::error::the LiveKit extension misses system libraries:"; echo "$missing"; exit 1
          fi

      # The network extension (HorizonLink) is committed, built by ds-net.yml from horizonserver at the
      # pinned commit: only check that what is committed is that build.
      - name: Network extension matches its pin
        run: tools/check_ds_net.sh

      # The tests call C# twins (TileFrameNative, CrackVoronoiNative, the mountain twins). Without a
      # built assembly they would fall back to GDScript and the twins would never be tested at all.
      - name: Build C#
        run: |
          # Double-precision GodotSharp from the editor zip, not nuget.org's single-precision one
          # (see NuGet.Config and build-client.yaml).
          export GODOT_SHARP_NUPKGS="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/GodotSharp/Tools/nupkgs"
          rm -rf ~/.nuget/packages/godotsharp/${GODOT_VERSION}* ~/.nuget/packages/godotsharpeditor/${GODOT_VERSION}* \
                 ~/.nuget/packages/godot.net.sdk/${GODOT_VERSION}* ~/.nuget/packages/godot.sourcegenerators/${GODOT_VERSION}*
          dotnet build DyingStar.csproj -c Debug

      # Registers every class_name (the tests reference them) and imports the resources.
      - name: Import project
        run: timeout 40m "$GODOT" --headless --path . --import || true

      # The whole suite, the C# twins and the shared material library check included: they are in
      # test/unit and block like every other test.
      - name: GUT suite
        run: tools/ci/run_gut.sh .godot/gut -gdir=res://test/unit

      - name: Keep the GUT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-report
          path: .godot/gut/
          if-no-files-found: ignore

      # Each test is judged by the result line it prints (tools/ci/run_marked.py): the engine's exit
      # code is not the test's (it aborts at shutdown here, exits 1 now and then on Windows).
      - name: Volcano activity, lifecycle and Tarsis III integration
        run: |
          run() { python3 tools/ci/run_marked.py --pass "$1" -- "$GODOT" --headless --path . "${@:2}"; }
          run 'LAVA_POLICY mode=normal pass=true' res://test/lava/test_policy.tscn -- --volcano-view --authored-lava
          run 'LAVA_POLICY mode=simulated pass=true' res://test/lava/test_policy.tscn -- --volcano-view
          run 'VOLCANO TARSIS III: .* 0 failures' res://test/volcano/test_tarsis_volcano_vfx.tscn -- --volcano-view
          run 'LAVA_PLANET_RESULT failures=0$' res://test/lava/test_planet_integration.tscn -- --volcano-view --lava-long-test
          run 'LAVA_SERVER failures=0$' res://test/lava/test_eruption_server.tscn -- --volcano-view
          run 'LAVA_WEEK pass=true' --script res://test/lava/test_sleep_week.gd

  # The C# twins reproduce GDScript bit for bit only while .NET's Math.Sin / Math.Atan2 return the
  # engine's own sin / atan2 bits. On Linux both are glibc; on Windows both should be the UCRT, and
  # this job is what says so. A Windows client whose terrain moved by one ulp would stand on a surface
  # the Linux server does not collide with.
  gut-windows:
    name: GUT C# twins (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # The version as GODOT_VERSION: the env context cannot be read here.
      GODOT: ${{ github.workspace }}\..\godot\Godot_v4.7.2-stable_mono_win64\Godot_v4.7.2-stable_mono_win64_console.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\godot
          key: godot-${{ env.GODOT_RELEASE }}-mono-win64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "..\godot"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "godot.zip"
          Invoke-WebRequest -Uri "https://github.com/DyingStar-game/godotandaddons/releases/download/$($env:GODOT_RELEASE)/Godot_v$($env:GODOT_VERSION)-stable_mono_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest
          Remove-Item $zip

      - name: Build C#
        run: |
          $env:GODOT_SHARP_NUPKGS = Join-Path $env:GITHUB_WORKSPACE "..\godot\Godot_v$($env:GODOT_VERSION)-stable_mono_win64\GodotSharp\Tools\nupkgs"
          dotnet build DyingStar.csproj -c Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import project
        run: |
          & $env:GODOT --headless --path . --import
          exit 0

      - name: C# twins against GDScript (bit for bit)
        run: |
          & $env:GODOT --headless --path . -s addons/gut/gut_cmdln.gd "-gtest=$($env:NATIVE_TESTS)" -gexit
          exit $LASTEXITCODE

      # Judged by the result line each test prints (tools/ci/run_marked.py): on Windows the engine
      # exits 1 now and then after a test that passed and called quit(0).
      - name: Lava dormant deposits through one week (C# against reference)
        run: |
          python tools/ci/run_marked.py --pass 'LAVA_POLICY mode=normal pass=true' -- $env:GODOT --headless --path . res://test/lava/test_policy.tscn -- --volcano-view --authored-lava
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/run_marked.py --pass 'LAVA_POLICY mode=simulated pass=true' -- $env:GODOT --headless --path . res://test/lava/test_policy.tscn -- --volcano-view
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/run_marked.py --pass 'LAVA_WEEK pass=true' -- $env:GODOT --headless --path . --script res://test/lava/test_sleep_week.gd
          exit $LASTEXITCODE

  lava-lockstep:
    name: Lava integer replay (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # executable: the version as GODOT_VERSION (the env context cannot be read in a matrix).
        include:
          - os: ubuntu-latest
            platform: linux
            archive: linux_x86_64
            executable: Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          - os: windows-latest
            platform: win64
            archive: win64
            executable: Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64_console.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Cache existing game engine
        id: lava-engine
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../godot
          key: godot-${{ env.GODOT_RELEASE }}-mono-${{ matrix.platform }}
      - name: Download game engine when absent
        if: steps.lava-engine.outputs.cache-hit != 'true'
        run: |
          $lavaEngineRoot = Join-Path $env:GITHUB_WORKSPACE '..' 'godot'
          New-Item -ItemType Directory -Force -Path $lavaEngineRoot | Out-Null
          $lavaArchive = Join-Path $env:RUNNER_TEMP 'lava-godot.zip'
          Invoke-WebRequest -Uri "https://github.com/DyingStar-game/godotandaddons/releases/download/$($env:GODOT_RELEASE)/Godot_v$($env:GODOT_VERSION)-stable_mono_${{ matrix.archive }}.zip" -OutFile $lavaArchive
          Expand-Archive -LiteralPath $lavaArchive -DestinationPath $lavaEngineRoot -Force
      - name: Integer physics and concurrent client/server golden replay
        run: |
          $lavaEngine = Join-Path $env:GITHUB_WORKSPACE '..' 'godot' '${{ matrix.executable }}'
          if ($IsLinux) { & chmod +x $lavaEngine }
          python test/lava/check_replay.py --godot $lavaEngine --project .godot/lava-replay --output .godot/lava-evidence
          exit $LASTEXITCODE
      - name: Retain per-platform replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lava-replay-${{ matrix.platform }}
          path: .godot/lava-evidence/

  scene-lint:
    name: Check Area3D monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No pip step on purpose: the checker is Python 3 stdlib only, so it runs on
      # the ubuntu-latest image as-is. Neither the self-hosted runner nor the custom
      # Godot 4.7 build is needed — it reads .tscn files as text.
      #
      # What it guards: an Area3D left with `monitoring` on (the engine default) also
      # keeps `collision_mask = 1`, the `world` layer, and queries the planet terrain
      # on EVERY physics step. Measured 2026-09-06: 150 such areas cost ~930 ms per
      # wall second — 2.2 FPS with physics starved to 17/60 Hz. The bug is silent
      # until the framerate collapses, which is why it needs a machine to catch it.
      - name: Check Area3D monitoring
        run: python3 tools/check_area_monitoring.py

      - name: Parser unit tests
        run: python3 test/unit/test_area_monitoring_py.py

      # The main menu's Credits page reads assets/credits.json, written from the credit .txt beside
      # each asset. On a pull request credits.yml rewrites it; this is the net for what lands on a
      # branch without one (a direct push, a fork the bot could not push to).
      - name: Check the credits list
        run: python3 tools/generate_credits.py --check

      - name: Credits generator unit tests
        run: python3 test/unit/test_generate_credits_py.py

      # The planet exporter: its geometry and pack format, and its pure-Python HEALPix (the one used
      # without healpy, as here); the QGIS road tools' terrain grid, profile twin and route search.
      # numpy, and scipy for the route search (its Dijkstra).
      - name: Planet exporter unit tests
        run: |
          pip3 install --quiet numpy scipy
          python3 test/unit/test_healpix_utils_py.py
          python3 test/unit/test_modifier_pack_py.py
          python3 test/unit/test_mountain_preview_py.py
          python3 test/unit/test_terrain_grid_py.py
          python3 test/unit/test_grade_profile_py.py
          python3 test/unit/test_route_search_py.py

      # The QGIS plugin as the team installs it: the zip's layout and the plugins.xml of our
      # plugin repository (.github/workflows/qgis-plugin.yml publishes them on a tag).
      - name: QGIS plugin package tests
        run: |
          python3 test/unit/test_qgis_plugin_package_py.py
          python3 test/unit/test_publish_log_py.py
          python3 test/unit/test_bake_lines_py.py

      # The shared material library: what a material.json may leave out (every map) and what it may
      # not (a base colour), and how the Blender add-on packs an opacity map. jsonschema and pillow
      # are what tools/validate.py reads a manifest and its maps with.
      - name: Material library unit tests
        run: |
          pip3 install --quiet numpy jsonschema pillow
          python3 test/unit/test_alpha_packer_py.py
          python3 test/unit/test_material_manifest_py.py

      # What turns the GUT job red (a failing test, a test script that did not load, no report).
      - name: GUT verdict unit tests
        run: python3 test/unit/test_gut_report_py.py

      # What judges the lava / volcano tests (their result line, not the engine's exit code).
      - name: Result-line runner unit tests
        run: python3 test/unit/test_run_marked_py.py

  linter:
    name: Run GDScript linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDScript linter
        run: pip3 install "gdtoolkit==4.*"

      - name: Run linter
        run: gdlint assets levels scenes server tools ui
