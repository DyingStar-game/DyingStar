name: Build Production Image

on:
  push:
    tags:
      - 'v*'

env:
  HARBOR_REGISTRY: harbor.dyingstar-game.space
  IMAGE_NAME: harbor.dyingstar-game.space/dyingstar/godotserver

jobs:
  build-and-push:
    name: Build & Push Server Docker Image
    runs-on: dyingstar-runners
    steps:
      - name: Install build tooling
        run: |
          # The self-hosted ARC runner image is minimal; these tools that
          # GitHub-hosted runners ship by default must be installed here.
          sudo apt-get update
          sudo apt-get install -y wget unzip zip

      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Delete blender files
        run: rm -fr assets_blender

      - name: Switch off dev tools for the build
        run: |
          # Globals.ENABLED_DEV_TOOLS ships ON in the repo so devs keep the tools;
          # a build must not. Each key is checked after the sed so a renamed or
          # removed key fails the build instead of silently shipping the tool.
          for tool in spawn_wheel zapette toggle_eva build_chunk_skirts; do
            sed -i -E "s/^([[:space:]]+\"$tool\": )true,/\1false,/" scenes/globals/globals.gd
            grep -qE "^[[:space:]]+\"$tool\": false," scenes/globals/globals.gd \
              || { echo "::error::dev tool '${tool}' not switched off in globals.gd"; exit 1; }
          done

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          no-cache: true
